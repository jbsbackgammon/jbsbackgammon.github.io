<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="JBS運営ツールの運営ツール一覧">
  <title>JBS運営ツール 運営ツール</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <img
        class="hero__logo"
        src="./assets/jbs-logo.png"
        alt="Japan Backgammon Society JBS"
      >
      <div class="hero__text">
        <h1>
          <span>JBS運営ツール</span>
        </h1>
      </div>
    </header>

    <section class="tools" aria-label="運営ツール一覧">
      <div class="tool-list">
        <a class="tool-card" href="https://jbsbackgammon.github.io/thumbnail/">
          <div>
            <p class="tool-card__category">THUMBNAIL</p>
            <h3>YouTubeサムネイル 作成ツール</h3>
          </div>
          <span class="tool-card__arrow" aria-hidden="true">→</span>
        </a>

        <a class="tool-card" href="https://jbsbackgammon.github.io/tournament/">
          <div>
            <p class="tool-card__category">Tournament</p>
            <h3>トーナメント表 作成ツール</h3>
          </div>
          <span class="tool-card__arrow" aria-hidden="true">→</span>
        </a>

        <div class="tool-card tool-card--disabled" aria-disabled="true">
          <div>
            <p class="tool-card__category">Position</p>
            <h3>ポジション図 作成ツール</h3>
          </div>
          <span class="status">未公開</span>
        </div>

        <div class="tool-card tool-card--disabled" aria-disabled="true">
          <div>
            <p class="tool-card__category">MATCH-REPLAY</p>
            <h3>棋譜自動再生システム</h3>
          </div>
          <span class="status">未公開</span>
        </div>

        <a class="tool-card" href="https://jbsbackgammon.github.io/official/">
          <div>
            <p class="tool-card__category">Website</p>
            <h3>JBS公式サイト リニューアル案</h3>
          </div>
          <span class="tool-card__arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

</body>
</html>

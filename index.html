<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="日本バックギャモン協会の運営ツール一覧">
  <title>日本バックギャモン協会 運営ツール</title>
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <img
        class="hero__logo"
        src="./assets/jbs-logo.png"
        alt="Japan Backgammon Society JBS"
      >
      <div class="hero__text">
        <p class="hero__eyebrow">Japan Backgammon Society</p>
        <h1>日本バックギャモン協会<br class="sp-only"> 運営ツール</h1>
        <p class="hero__description">協会運営で使用する各種ツール・開発ページへのリンク集です。</p>
      </div>
    </header>

    <section class="tools" aria-labelledby="tools-heading">
      <div class="section-heading">
        <h2 id="tools-heading">TOOLS</h2>
        <span>運営ツール一覧</span>
      </div>

      <div class="tool-list">
        <a class="tool-card" href="https://jbsbackgammon.github.io/thumbnail/">
          <div>
            <p class="tool-card__category">YouTube</p>
            <h3>YouTubeサムネイル 作成ツール</h3>
          </div>
          <span class="tool-card__arrow" aria-hidden="true">→</span>
        </a>

        <a class="tool-card" href="https://jbsbackgammon.github.io/tournament/">
          <div>
            <p class="tool-card__category">Tournament</p>
            <h3>トーナメント表 作成ツール</h3>
          </div>
          <span class="tool-card__arrow" aria-hidden="true">→</span>
        </a>

        <div class="tool-card tool-card--disabled" aria-disabled="true">
          <div>
            <p class="tool-card__category">Position</p>
            <h3>ポジション図 作成ツール</h3>
          </div>
          <span class="status">未公開</span>
        </div>

        <div class="tool-card tool-card--disabled" aria-disabled="true">
          <div>
            <p class="tool-card__category">Replay</p>
            <h3>棋譜自動再生システム</h3>
          </div>
          <span class="status">未公開</span>
        </div>

        <a class="tool-card" href="https://jbsbackgammon.github.io/official/">
          <div>
            <p class="tool-card__category">Website</p>
            <h3>JBS公式サイト リニューアル案</h3>
          </div>
          <span class="tool-card__arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Japan Backgammon Society</span>
  </footer>
</body>
</html>
